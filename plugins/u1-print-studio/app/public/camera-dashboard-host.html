<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>U1 Camera</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #fff; color: #202832; }
      header {
        min-height: 44px; padding: 8px 12px; display: flex; align-items: center;
        gap: 10px; border-bottom: 1px solid #eceef0; background: #fff;
      }
      strong { font-size: 13px; letter-spacing: .01em; }
      #bridge-state { color: #707987; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .spacer { flex: 1; }
      button {
        min-height: 30px; padding: 4px 10px; border: 1px solid #eceef0;
        border-radius: 8px; color: inherit; background: #f8f9fa; cursor: pointer;
      }
      header[hidden] { display: none; }
      iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <header hidden>
      <strong>U1 Camera</strong>
      <span id="bridge-state">starting</span>
      <span class="spacer"></span>
      <button id="reload" type="button">Reload widget</button>
    </header>
    <iframe id="camera-widget" title="U1 Camera" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
    <script>
      const frame = document.querySelector("#camera-widget");
      const bridgeState = document.querySelector("#bridge-state");
      const widgetSource = "/dashboard/camera_widget";
      let generation = 0;
      const allowed = Object.freeze({
        get_u1_camera_frame: ["authorizeLive"],
        open_u1_camera_stream: ["activationToken"],
        answer_u1_camera_stream: ["sessionId", "sdp"],
        add_u1_camera_ice_candidates: ["sessionId", "candidates"],
        close_u1_camera_stream: ["sessionId"],
      });
      const reply = (id, result, error) => {
        frame.contentWindow?.postMessage(
          { jsonrpc: "2.0", id, ...(error ? { error } : { result }) },
          location.origin
        );
      };
      const callTool = async (name, argumentsValue = {}) => {
        if (typeof name !== "string" || !Object.hasOwn(allowed, name) || !argumentsValue || typeof argumentsValue !== "object" || Array.isArray(argumentsValue) || Object.keys(argumentsValue).some(key => !allowed[name].includes(key))) throw new Error("unsupported_camera_request");
        bridgeState.textContent = "Calling camera";
        const response = await fetch("/dashboard/tools/call", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name, arguments: argumentsValue }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error ?? `HTTP ${response.status}`);
        bridgeState.textContent = "bridge ready · camera calls only";
        return result;
      };

      window.addEventListener("message", async (event) => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.method === "ui/initialize" && typeof message.id === "number") {
          generation += 1;
          reply(message.id, {
            protocolVersion: "2026-01-26",
            hostInfo: { name: "u1-camera-dashboard", version: "1.0.0" },
            hostContext: {
              displayMode: "inline",
              availableDisplayModes: ["inline"],
              safeArea: { insets: { top: 0, right: 0, bottom: 0, left: 0 } },
            },
          });
          return;
        }

        if (message.method === "ui/notifications/initialized") {
          bridgeState.textContent = "bridge ready · camera calls only";
          return;
        }

        if (message.method === "tools/call" && typeof message.id === "number") {
          const current = generation;
          try {
            const result = await callTool(message.params?.name, message.params?.arguments ?? {});
            if (current === generation) reply(message.id, result);
            else if (message.params?.name === "open_u1_camera_stream") {
              const sessionId = result?._meta?.cameraStream?.sessionId;
              if (typeof sessionId === "string" && sessionId.length >= 16 && new TextEncoder().encode(sessionId).length <= 512) {
                // A child replaced during allocation cannot close its returned
                // lease. Release that capability only; never forward it onward.
                void callTool("close_u1_camera_stream", { sessionId }).catch(() => {});
              }
            }
          } catch {
            if (current !== generation) return;
            reply(message.id, null, { code: -32000, message: "tool_failed" });
            bridgeState.textContent = "tool failed";
          }
          return;
        }

        if (message.method === "ui/request-display-mode" && typeof message.id === "number") {
          reply(message.id, { mode: "inline" });
        }
      });

      document.querySelector("#reload").addEventListener("click", () => {
        generation += 1;
        bridgeState.textContent = "reloading";
        frame.src = `${widgetSource}?t=${Date.now()}`;
      });
      window.addEventListener("pagehide", () => { generation += 1; });
      frame.src = widgetSource;
    </script>
  </body>
</html>
