<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>U1 Camera Dashboard</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #080a0d; color: #e9edf2; }
      header {
        min-height: 44px; padding: 8px 12px; display: flex; align-items: center;
        gap: 10px; border-bottom: 1px solid #252a31; background: #111419;
      }
      strong { font-size: 13px; letter-spacing: .01em; }
      #bridge-state { color: #8f9aa8; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .spacer { flex: 1; }
      button {
        min-height: 30px; padding: 4px 10px; border: 1px solid #3b424d;
        border-radius: 8px; color: inherit; background: #20252c; cursor: pointer;
      }
      header[hidden] { display: none; }
      iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; background: #191919; }
    </style>
  </head>
  <body>
    <header hidden>
      <strong>U1 Camera Test</strong>
      <span id="bridge-state">starting</span>
      <span class="spacer"></span>
      <button id="reload" type="button">Reload widget</button>
    </header>
    <iframe id="camera-widget" src="/camera-widget?standalone=1" title="U1 Print Studio camera widget" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
    <script>
      const frame = document.querySelector("#camera-widget");
      const bridgeState = document.querySelector("#bridge-state");
      const reply = (id, result, error) => {
        frame.contentWindow?.postMessage(
          { jsonrpc: "2.0", id, ...(error ? { error } : { result }) },
          location.origin
        );
      };
      const callTool = async (name, arguments = {}) => {
        bridgeState.textContent = `calling ${name}`;
        const response = await fetch("/dashboard/tools/call", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name, arguments }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error ?? `HTTP ${response.status}`);
        bridgeState.textContent = "bridge ready · camera calls only";
        return result;
      };

      window.addEventListener("message", async (event) => {
        if (event.source !== frame.contentWindow) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.method === "ui/initialize" && typeof message.id === "number") {
          reply(message.id, {
            protocolVersion: "2026-01-26",
            hostInfo: { name: "u1-camera-dashboard", version: "1.0.0" },
            hostContext: {
              displayMode: "inline",
              availableDisplayModes: ["inline"],
              safeArea: { insets: { top: 0, right: 0, bottom: 0, left: 0 } },
            },
          });
          return;
        }

        if (message.method === "ui/notifications/initialized") {
          bridgeState.textContent = "bridge ready · camera calls only";
          return;
        }

        if (message.method === "tools/call" && typeof message.id === "number") {
          try {
            reply(
              message.id,
              await callTool(message.params?.name, message.params?.arguments ?? {})
            );
          } catch {
            reply(message.id, null, { code: -32000, message: "tool_failed" });
            bridgeState.textContent = "tool failed";
          }
          return;
        }

        if (message.method === "ui/request-display-mode" && typeof message.id === "number") {
          reply(message.id, { mode: "inline" });
        }
      });

      document.querySelector("#reload").addEventListener("click", () => {
        bridgeState.textContent = "reloading";
        frame.src = `/camera-widget?standalone=1&t=${Date.now()}`;
      });
    </script>
  </body>
</html>
