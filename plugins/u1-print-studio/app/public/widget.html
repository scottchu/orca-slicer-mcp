  <head>

    <title>U1 Printer Observation</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1e20;
        --muted: #6b7077;
        --faint: #8b8d8e;
        --surface: #fff;
        --canvas: #fdfdfd;
        --line: #eceef0;
        --soft: #f8f9fa;
        --brand: #f4b927;
        --brand-warm: #ff5f28;
        --positive: #60b982;
        --negative: #b83232;
        --shadow: 0 5px 24px rgba(28, 30, 32, 0.055);
        --radius: 24px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: calc(22px + var(--safe-top)) calc(18px + var(--safe-right)) calc(22px + var(--safe-bottom)) calc(18px + var(--safe-left));
        color: var(--ink);
        background: var(--canvas);
      }
      button { color: inherit; font: inherit; touch-action: manipulation; }
      button:not(:disabled) { cursor: pointer; }
      button:focus-visible { outline: 3px solid rgba(255, 205, 0, 0.9); outline-offset: 3px; }
      .shell { width: min(100%, 820px); margin: 0 auto; }
      .modules { display: grid; gap: 16px; }
      .instrument { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
      .instrument-header { display: flex; align-items: center; gap: 18px; padding: 32px 32px 26px; }
      .instrument-title { min-width: 0; flex: 1; }
      .instrument-info { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
      .instrument-info time { display: block; font-variant-numeric: tabular-nums; }
      .refresh-error { display: block; }
      .loading-guidance { margin: 12px 0 0; font-size: 12px; line-height: 1.5; }
      h2 { margin: 0; font-size: clamp(20px, 3.7vw, 27px); font-weight: 620; line-height: 1.2; letter-spacing: -0.035em; }
      .refresh { display: inline-grid; width: 44px; min-width: 44px; min-height: 44px; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--soft); }
      .refresh svg { width: 18px; height: 18px; }
      .refresh[aria-busy="true"] svg { animation: spin 0.8s linear infinite; }
      .strip-list { margin: 0 18px 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; }
      .strip { display: grid; grid-template-columns: minmax(170px, 1.25fr) repeat(2, minmax(90px, 0.75fr)); align-items: center; min-height: 86px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
      .strip:last-child { border-bottom: 0; }
      .strip.active { box-shadow: inset 5px 0 0 var(--brand); }
      .identity { display: flex; min-width: 0; align-items: center; gap: 14px; }
      .strip.zone-row .identity { padding-left: 8px; }
      .roundel { display: grid; width: 52px; height: 52px; flex: none; place-items: center; border-radius: 50%; background: var(--soft); font-size: 19px; font-weight: 800; }
      .active .roundel { background: var(--brand); }
      .identity strong { display: block; font-size: 15px; }
      .micro { margin-top: 5px; color: var(--muted); font-size: 11px; font-weight: 740; letter-spacing: 0.08em; text-transform: uppercase; }
      .micro .dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--brand); }
      .reading small { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
      .reading strong { font-size: clamp(22px, 5vw, 30px); font-weight: 640; letter-spacing: -0.035em; }
      .reading.unavailable strong { color: var(--muted); font-size: 15px; font-weight: 540; letter-spacing: 0; }
      .active .reading strong { color: var(--ink); }
      .icon-tile { display: grid; place-items: center; flex: none; width: 64px; height: 72px; border: 1px solid var(--line); border-radius: 16px; background: #fdfdfd; }
      .icon-tile svg { width: 28px; height: 28px; stroke-width: 1.7; }
      .metric-icon { display: inline-flex; vertical-align: middle; }
      .metric-icon svg { width: 18px; height: 18px; }
      .progress-body { padding: 12px 32px 18px; }
      .progress-result { flex: none; min-width: 0; text-align: right; }
      .progress-percent { display: block; color: var(--positive); font-size: clamp(44px, 9vw, 72px); line-height: 1; font-weight: 300; letter-spacing: -0.065em; font-variant-numeric: tabular-nums; }
      .progress-percent.unknown { font-size: 24px; color: var(--muted); letter-spacing: -0.02em; }
      .progress-state { display: block; margin-top: 8px; color: var(--muted); font-size: 15px; }
      .progress-track { height: 8px; margin: 10px 0 26px; overflow: hidden; border-radius: 999px; background: #f1f2f3; }
      .progress-fill { height: 100%; border-radius: inherit; background: var(--brand); }
      .progress-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 14px; }
      .progress-meta > span { display: inline-flex; align-items: center; gap: 7px; }
      .layer-current { color: #a16d00; font-weight: 500; }
      .progress-metrics { display: flex; flex-wrap: wrap; gap: 20px; margin: 30px 0 0; padding-top: 24px; border-top: 1px solid var(--line); }
      .progress-metrics > div { min-width: 100px; }
      .progress-metrics dt { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
      .progress-metrics dd { margin: 12px 0 0 26px; font-size: 20px; font-variant-numeric: tabular-nums; }
      .head-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 0 18px 18px; }
      .head-card { min-height: 148px; padding: 16px 12px; border: 1px solid var(--line); border-radius: 18px; text-align: center; }
      .head-card .roundel { width: 42px; height: 42px; margin: 0 auto 12px; font-size: 16px; }
      .head-card .material { min-height: 38px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
      .material-info { margin: 0 18px 14px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
      .material-color { display: flex; align-items: center; gap: 5px; overflow-wrap: anywhere; }
      .material-swatch { flex: 0 0 12px; width: 12px; height: 12px; border: 1px solid var(--muted); border-radius: 50%; }
      .head-card .temperature { margin-top: 7px; font-size: 12px; }
      .head-card.active { box-shadow: inset 0 4px 0 var(--brand); }
      .empty-panel { margin: 0 18px 18px; padding: 24px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); background: rgba(245, 245, 244, 0.62); }
      .empty-panel strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 16px; }
      .job-current { margin: 0 18px 12px; padding: 18px; border: 1px solid var(--line); border-radius: 18px; }
      .job-current strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .job-meta { display: flex; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 12px; }
      .mesh-body { padding: 0 24px 20px; }
      .mesh-caption { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
      .mesh-map { display: block; width: min(100%, 320px); margin: 0 auto 12px; color: var(--muted); }
      .mesh-map text { fill: currentColor; font-family: inherit; font-size: 11px; }
      .mesh-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; }
      .mesh-summary dt { color: var(--muted); font-size: 12px; }
      .mesh-summary dd { margin: 5px 0 0; font-size: clamp(14px, 3.6vw, 20px); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .domain-warning { margin-top: 6px; color: var(--negative); font-size: 12px; line-height: 1.5; }
      .instrument-footer { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin: 0 24px; padding: 12px 0 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.5; }
      .freshness-warning, .refresh-error { color: var(--negative); }
      .refresh-error:empty { display: none; }
      .loading { padding: 48px 24px; color: var(--muted); text-align: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .refresh[aria-busy="true"] svg { animation: none; } }
      @media (max-width: 620px) {
        body { padding: calc(10px + var(--safe-top)) calc(8px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(8px + var(--safe-left)); }
        .modules { gap: 10px; }
        .instrument { border-radius: 20px; }
        .instrument-header { padding: 24px 20px 20px; gap: 12px; }
        .strip { grid-template-columns: minmax(150px, 1.2fr) repeat(2, minmax(74px, 0.7fr)); }
        .head-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .instrument-footer { margin-right: 18px; margin-left: 18px; }
      }
      @media (max-width: 390px) {
        .instrument-header { padding: 20px 18px 16px; }
        .strip-list { margin-right: 12px; margin-left: 12px; }
        .strip { grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; }
        .strip .identity { grid-column: 1 / -1; }
        .roundel { width: 44px; height: 44px; }
        .progress-body { padding-right: 18px; padding-left: 18px; }
      }
      @media (max-width: 620px) {
        .icon-tile { width: 44px; height: 52px; border-radius: 12px; }
        .icon-tile svg { width: 24px; height: 24px; }
        .progress-body { padding: 4px 20px 14px; }
        .progress-result { margin-left: auto; }
        .progress-state { font-size: 12px; }
        .progress-percent { font-size: 48px; }
        .progress-instrument .instrument-header { flex-wrap: wrap; }
        .progress-instrument .instrument-title { flex-basis: calc(100% - 60px); }
        .progress-metrics { margin-top: 24px; padding-top: 20px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="modules" id="modules"><div class="instrument loading">Waiting for printer observation…</div></div>
    </main>
    <script type="module">
      const VIEWS = ["overview", "progress", "thermals", "heads", "jobs", "job_history", "queue", "fans", "bed_mesh"];
      const modulesElement = document.querySelector("#modules");
      const pendingRequests = new Map();
      let rpcId = 0;
      let observation = null;
      let bridge = null;
      let loadTimer = null;
      let refreshPending = false;
      let selectedView = null;
      const escapeHtml = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      const validNumber = (value) => typeof value === "number" && Number.isFinite(value);
      const valueOf = (field) => field?.state === "known" || field?.state === "stale" ? field.value : null;
      const formatTemperature = (field) => validNumber(valueOf(field)) ? `${Math.round(field.value)}°` : "Unknown";
      const formatDuration = (field) => { const seconds = valueOf(field); if (!validNumber(seconds)) return "Unknown"; const minutes = Math.max(0, Math.round(seconds / 60)); return minutes < 60 ? `${minutes}m` : `${Math.floor(minutes / 60)}h ${minutes % 60}m`; };
      const observedLabel = (value) => { const date = typeof value === "string" && value ? new Date(value) : null; return !date || Number.isNaN(date.valueOf()) ? "Observation time unavailable" : `Observed ${date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`; };
      const freshnessLabel = (state) => ({ fresh: "", stale: "Stale", offline: "Offline", unknown: "Freshness unknown" })[state] ?? "Freshness unknown";
      const observationInfo = (sourceObservedAt = observation?.sourceObservedAt, freshnessState = observation?.freshness) => { const freshness = freshnessLabel(freshnessState); return `<div class="instrument-info"><time>${escapeHtml(observedLabel(sourceObservedAt))}${freshness ? ` <span class="freshness-warning">· ${escapeHtml(freshness)}</span>` : ""}</time><span class="refresh-error" role="status"></span></div>`; };
      // Feather Icons 4.29.2, MIT; full notice is bundled in this document.
      const icons = Object.freeze({"printer":"<svg aria-hidden=\"true\" data-icon=\"feather-printer\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 6 2 18 2 18 9\"/><path d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"/><rect x=\"6\" y=\"14\" width=\"12\" height=\"8\"/></svg>","clock":"<svg aria-hidden=\"true\" data-icon=\"feather-clock\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/></svg>","thermometer":"<svg aria-hidden=\"true\" data-icon=\"feather-thermometer\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z\"/></svg>","layers":"<svg aria-hidden=\"true\" data-icon=\"feather-layers\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 2 7 12 12 22 7 12 2\"/><polyline points=\"2 17 12 22 22 17\"/><polyline points=\"2 12 12 17 22 12\"/></svg>","file-text":"<svg aria-hidden=\"true\" data-icon=\"feather-file-text\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><line x1=\"16\" y1=\"13\" x2=\"8\" y2=\"13\"/><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"/><polyline points=\"10 9 9 9 8 9\"/></svg>","list":"<svg aria-hidden=\"true\" data-icon=\"feather-list\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"8\" y1=\"6\" x2=\"21\" y2=\"6\"/><line x1=\"8\" y1=\"12\" x2=\"21\" y2=\"12\"/><line x1=\"8\" y1=\"18\" x2=\"21\" y2=\"18\"/><line x1=\"3\" y1=\"6\" x2=\"3.01\" y2=\"6\"/><line x1=\"3\" y1=\"12\" x2=\"3.01\" y2=\"12\"/><line x1=\"3\" y1=\"18\" x2=\"3.01\" y2=\"18\"/></svg>","wind":"<svg aria-hidden=\"true\" data-icon=\"feather-wind\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2\"/></svg>","grid":"<svg aria-hidden=\"true\" data-icon=\"feather-grid\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/></svg>","activity":"<svg aria-hidden=\"true\" data-icon=\"feather-activity\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"/></svg>","refresh-cw":"<svg aria-hidden=\"true\" data-icon=\"feather-refresh-cw\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"23 4 23 10 17 10\"/><polyline points=\"1 20 1 14 7 14\"/><path d=\"M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15\"/></svg>"});
      const icon = (name) => icons[name] ?? icons.activity;
      const titleIcons = Object.freeze({ "Print Progress": "printer", Thermals: "thermometer", "Heads & Filaments": "layers", "Current Job": "file-text", "Job History": "clock", Queue: "list", "Fans & Air": "wind", "Bed Mesh": "grid", Overview: "activity" });
      const provenance = () => `<footer class="instrument-footer"><button class="refresh" type="button" title="Refresh observation" aria-label="Refresh observation">${icon("refresh-cw")}</button></footer>`;
      const header = (title, showObservation = true, sourceObservedAt = observation?.sourceObservedAt, freshness = observation?.freshness, message = "", trailing = "") => `<header class="instrument-header"><span class="icon-tile" aria-hidden="true">${icon(titleIcons[title])}</span><div class="instrument-title"><h2>${escapeHtml(title)}</h2>${showObservation ? observationInfo(sourceObservedAt, freshness) : ""}${message ? `<div class="domain-warning" role="status">${escapeHtml(message)}</div>` : ""}</div>${trailing}</header>`;
      const unknown = (title, data) => `<section class="instrument">${header(title)}<div class="empty-panel"><strong>${data?.kind === "overview" ? "Overview deferred" : "Not implemented yet"}</strong>${data?.kind === "overview" ? "The combined overview is not implemented." : "This view’s printer-data mapping is not implemented. Values are unknown."}</div>${provenance(data?.provenance)}</section>`;
      const layerPosition = (fields) => {
        const current = valueOf(fields?.currentLayer); const total = valueOf(fields?.totalLayers);
        return Number.isSafeInteger(current) && Number.isSafeInteger(total) && total > 0 && current >= 0 && current <= total ? { current, total } : null;
      };
      const renderProgress = (data) => {
        const fields = data?.fields; const rawPercent = valueOf(fields?.percent);
        const percent = validNumber(rawPercent) && rawPercent >= 0 && rawPercent <= 100 ? rawPercent : null;
        const position = layerPosition(fields);
        const layers = position ? `Layer <strong class="layer-current">${position.current}</strong> / ${position.total}` : "Layer progress unavailable";
        const result = `<div class="progress-result"><strong class="progress-percent${percent === null ? " unknown" : ""}">${percent === null ? "Unknown" : `${percent.toFixed(percent % 1 ? 1 : 0)}%`}</strong><span class="progress-state">${escapeHtml(observation.printerStateLabel)}</span></div>`;
        const track = percent === null
          ? '<div class="progress-track unavailable" role="progressbar" aria-label="Reported print progress" aria-valuetext="Reported progress unavailable"></div>'
          : `<div class="progress-track" role="progressbar" aria-label="Reported print progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><div class="progress-fill" style="width:${percent}%"></div></div>`;
        const elapsed = valueOf(fields?.elapsedSeconds);
        const metrics = validNumber(elapsed) && elapsed >= 0 ? `<dl class="progress-metrics"><div><dt><span class="metric-icon">${icon("clock")}</span>Elapsed</dt><dd>${escapeHtml(formatDuration(fields.elapsedSeconds))}</dd></div></dl>` : "";
        const remaining = valueOf(fields?.estimatedRemainingSeconds);
        const eta = validNumber(remaining) && remaining >= 0 ? `About ${escapeHtml(formatDuration(fields.estimatedRemainingSeconds))} left` : "Estimate unknown";
        return `<section class="instrument progress-instrument">${header("Print Progress", true, observation.sourceObservedAt, observation.freshness, "", result)}<div class="progress-body">${track}<div class="progress-meta"><span>${layers}</span><span><span class="metric-icon">${icon("clock")}</span>${eta}</span></div>${metrics}</div>${provenance()}</section>`;
      };
      const renderThermals = (data) => {
        const rows = (data?.readings ?? []).map((reading) => { const known = reading.state === "known" || reading.state === "stale"; const active = valueOf(reading.active) === true; const toolReading = reading.id.startsWith("tool-"); const badge = toolReading ? `<span class="roundel">T${escapeHtml(reading.id.slice(-1))}</span>` : ""; return `<div class="strip${active ? " active" : ""}${toolReading ? "" : " zone-row"}"><div class="identity">${badge}<span><strong>${escapeHtml(reading.label)}</strong><span class="micro">${active ? '<span class="dot"></span>Active' : escapeHtml(valueOf(reading.heaterState) ?? "Unknown")}</span></span></div><div class="reading${known ? "" : " unavailable"}"><small>Actual</small><strong>${escapeHtml(formatTemperature(reading.actual))}</strong></div><div class="reading${known ? "" : " unavailable"}"><small>Target</small><strong>${escapeHtml(formatTemperature(reading.target))}</strong></div></div>`; }).join("");
        return `<section class="instrument">${header("Thermals")}<div class="strip-list">${rows}</div>${provenance(data?.provenance)}</section>`;
      };
      const renderHeads = (data) => {
        const materialData = data?.materials;
        const materialState = materialData?.state ?? "unknown";
        const materialStatus = ({ unknown: "Material data unknown", unsupported: "Material data unsupported", unavailable: "Material data unavailable", stale: "Stale material data" })[materialState] ?? "";
        const materialTime = observedLabel(materialData?.sourceObservedAt);
        const failed = materialState === "stale" && materialData?.reason ? " · Refresh failed; last observation retained" : "";
        const cards = [1, 2, 3, 4].map((physicalTool) => {
          const head = (data?.items ?? []).find(item => item.physicalTool === physicalTool) ?? {};
          const active = valueOf(head.active) === true;
          const rawColor = valueOf(head.color);
          const color = typeof rawColor === "string" && /^#(?:[0-9a-f]{6}|[0-9a-f]{8})$/i.test(rawColor) ? rawColor.toUpperCase() : null;
          const presence = valueOf(head.reportedPresence);
          const presenceText = presence === true ? "Filament reported present" : presence === false ? "No filament reported" : "Presence unknown";
          const material = [valueOf(head.vendor) ?? "Vendor unknown", valueOf(head.materialType) ?? "Material unknown", valueOf(head.subtype)].filter(Boolean).join(" ");
          return `<article class="head-card${active ? " active" : ""}"><span class="roundel">T${physicalTool}</span><strong>Tool ${physicalTool}</strong><div class="material">${escapeHtml(material)}<div class="material-color">${color ? `<span class="material-swatch" aria-hidden="true" style="background-color:${color}"></span>${color}` : "Color unknown"}</div><span class="micro">${presenceText}</span></div><div class="temperature">${escapeHtml(formatTemperature(head.temperature))}${valueOf(head.target) !== null ? ` / ${escapeHtml(formatTemperature(head.target))}` : ""}</div>${active ? '<span class="micro"><span class="dot"></span>Active</span>' : `<span class="micro">${escapeHtml(valueOf(head.headState) ?? "Unknown")}</span>`}</article>`;
        }).join("");
        return `<section class="instrument">${header("Heads & Filaments")}<p class="material-info">Printer-reported material · ${escapeHtml(materialTime)}${materialStatus ? ` · ${escapeHtml(materialStatus)}` : ""}${failed}</p><div class="head-grid">${cards}</div>${provenance(data?.provenance)}</section>`;
      };
      const renderJobs = (data) => { const current = data?.current ? `<div class="job-current"><strong>${escapeHtml(valueOf(data.current.filename) ?? "Filename unknown")}</strong><div class="job-meta"><span>${valueOf(data.current.storageActive) === null ? "Storage unknown" : valueOf(data.current.storageActive) ? "Storage active" : "Storage inactive"}</span></div></div>` : '<div class="empty-panel"><strong>No current job observed</strong>Current job identity is unknown.</div>'; return `<section class="instrument">${header("Current Job")}${current}${provenance(data?.provenance)}</section>`; };
      const renderJobHistory = () => `<section class="instrument">${header("Job History", true, null)}<div class="empty-panel"><strong>Not implemented yet</strong>Previous jobs aren’t available yet.</div>${provenance()}</section>`;
      const renderQueue = (data) => unknown("Queue", data);
      const renderFans = (data) => unknown("Fans & Air", data);
      const renderBedMesh = (data) => {
        const known = data?.state === "known" || data?.state === "stale";
        const stale = data?.state === "stale" || data?.freshness === "stale";
        const heading = header("Bed Mesh", true, data?.sourceObservedAt ?? null, data?.freshness ?? "unknown", stale && data?.reason ? "Refresh unavailable · showing the last observed mesh state" : "");
        const empty = (title, detail) => `<section class="instrument">${heading}<div class="empty-panel"><strong>${title}</strong>${detail}</div>${provenance()}</section>`;
        if (known && data?.status === "no_active_mesh" && data?.matrix === null) return empty(stale ? "Last observation: no active mesh" : "No active mesh", "The printer reported no loaded bed mesh.");
        const matrix = data?.matrix; const bounds = data?.bounds;
        const bounded = (n) => validNumber(n) && Math.abs(n) <= 1000000;
        const valid = known && data?.status === "active" && Array.isArray(matrix) && matrix.length >= 2 && matrix.length <= 64 &&
          Array.isArray(matrix[0]) && matrix[0].length >= 2 && matrix[0].length <= 64 &&
          matrix.every(row => Array.isArray(row) && row.length === matrix[0].length && row.every(bounded)) &&
          bounds && [bounds.xMin, bounds.xMax, bounds.yMin, bounds.yMax].every(bounded) && bounds.xMax > bounds.xMin && bounds.yMax > bounds.yMin;
        if (!valid) return empty(data?.state === "unsupported" ? "Bed mesh not reported" : data?.state === "unknown" ? "Bed mesh not observed" : "Bed mesh unavailable", "No reported probe grid is available. Refresh to check again.");
        const rows = matrix.length; const columns = matrix[0].length;
        const values = matrix.flat(); const min = Math.min(...values); const max = Math.max(...values); const range = max - min;
        const mm = value => `${(Object.is(value, -0) ? 0 : value).toFixed(3)} mm`;
        const axis = value => value === 0 ? "0" : Math.abs(value) >= 10000 || Math.abs(value) < 0.01
          ? value.toExponential(2).replace("e+", "e") : String(Number(value.toPrecision(4)));
        const cells = matrix.map((row, y) => row.map((z, x) => {
          const shade = range === 0 ? 58 : 25 + (z - min) / range * 55;
          const xpos = bounds.xMin + x / (columns - 1) * (bounds.xMax - bounds.xMin);
          const ypos = bounds.yMin + y / (rows - 1) * (bounds.yMax - bounds.yMin);
          return `<rect class="mesh-cell" data-row="${y}" data-column="${x}" x="${60 + x * 244 / columns}" y="${18 + (rows - 1 - y) * 190 / rows}" width="${244 / columns}" height="${190 / rows}" fill="hsl(205 18% ${shade}%)"><title>X ${mm(xpos)}, Y ${mm(ypos)}, Z ${mm(z)}</title></rect>`;
        }).join("")).join("");
        const summary = `${columns} by ${rows} reported probe grid. Minimum ${mm(min)}, maximum ${mm(max)}, range ${mm(range)}. X ${bounds.xMin} to ${bounds.xMax} mm, Y ${bounds.yMin} to ${bounds.yMax} mm. Maximum Y is at the top. Observation time is the server receipt, not a new calibration or probe capture time.`;
        const profile = typeof data.profile === "string" && /^[\p{L}\p{N} _.-]{1,80}$/u.test(data.profile) ? ` · ${escapeHtml(data.profile)}` : "";
        return `<section class="instrument">${heading}<div class="mesh-body"><p class="mesh-caption">Reported probe grid · ${columns} × ${rows}${profile}</p><svg class="mesh-map" viewBox="0 0 320 260" role="img" aria-label="${escapeHtml(summary)}">${cells}<text x="54" y="26" text-anchor="end">${axis(bounds.yMax)}</text><text x="54" y="208" text-anchor="end">${axis(bounds.yMin)}</text><text x="26" y="120" text-anchor="middle" transform="rotate(-90 26 120)">Y (mm)</text><text x="60" y="230">${axis(bounds.xMin)}</text><text x="304" y="230" text-anchor="end">${axis(bounds.xMax)}</text><text x="182" y="252" text-anchor="middle">X (mm)</text></svg><dl class="mesh-summary"><div><dt>Minimum</dt><dd>${mm(min)}</dd></div><div><dt>Maximum</dt><dd>${mm(max)}</dd></div><div><dt>Range</dt><dd>${mm(range)}</dd></div></dl></div>${provenance()}</section>`;
      };
      const renderOverview = (data) => unknown("Overview", data);
      const renderers = { overview: renderOverview, progress: renderProgress, thermals: renderThermals, heads: renderHeads, jobs: renderJobs, job_history: renderJobHistory, queue: renderQueue, fans: renderFans, bed_mesh: renderBedMesh };
      const render = () => { if (!observation?.module) return; const view = VIEWS.includes(observation.view) ? observation.view : "overview"; modulesElement.innerHTML = renderers[view](observation.module); modulesElement.querySelectorAll(".refresh").forEach((button) => button.addEventListener("click", () => void refresh())); window.openai?.notifyIntrinsicHeight?.(); };
      const rpcNotify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      const rpcRequest = (method, params) => new Promise((resolve, reject) => {
        const id = ++rpcId;
        const timer = setTimeout(() => { pendingRequests.delete(id); reject(new Error("Host request timed out")); }, 15000);
        pendingRequests.set(id, { resolve, reject, timer });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
      const validObservation = (value) => value && VIEWS.includes(value.view) &&
        value.module?.kind === value.view && typeof value.module.state === "string";
      const applyResult = (result) => {
        const candidates = [result?.structuredContent, result?.result?.structuredContent, result?.mcp_tool_result?.structuredContent, result?.call_tool_result?.structuredContent, result];
        const candidate = candidates.find(validObservation);
        if (!candidate || (selectedView && candidate.view !== selectedView)) return false;
        selectedView = candidate.view;
        const previous = observation;
        observation = candidate;
        try { render(); } catch { observation = previous; return false; }
        clearTimeout(loadTimer);
        return true;
      };
      const applyGlobals = (globals = {}) => {
        const metadata = globals.toolResponseMetadata;
        const requested = globals.toolInput?.view;
        if (!selectedView && VIEWS.includes(requested)) selectedView = requested;
        return [globals.toolOutput, metadata?.mcp_tool_result, metadata?.call_tool_result, metadata].some(applyResult);
      };
      const showLoadError = () => {
        if (observation) return;
        const canRetry = selectedView && window.parent !== window;
        modulesElement.innerHTML = `<section class="instrument">${header("Couldn’t load this view", false)}<div class="empty-panel">The widget did not receive a printer observation. No current values are available.<p class="loading-guidance" role="status">${canRetry ? "Try loading the view again." : "Reopen this card from the conversation to try again."}</p></div>${canRetry ? '<footer class="instrument-footer"><button class="refresh" type="button" aria-label="Retry loading observation">Retry</button></footer>' : ""}</section>`;
        modulesElement.querySelector(".refresh")?.addEventListener("click", () => void retryLoad());
        window.openai?.notifyIntrinsicHeight?.();
      };
      const refresh = async () => {
        if (!selectedView || refreshPending || window.parent === window) return;
        refreshPending = true;
        modulesElement.querySelectorAll(".refresh").forEach((button) => { button.disabled = true; button.setAttribute("aria-busy", "true"); });
        try {
          if (!bridge) bridge = await initializeBridge();
          const result = await rpcRequest("tools/call", { name: "refresh_printer_observation", arguments: { view: selectedView } });
          if (!applyResult(result)) throw new Error("Observation unavailable");
        } catch {
          if (observation) { const error = modulesElement.querySelector(".refresh-error"); if (error) error.textContent = "Refresh failed · showing previous observation"; }
          else showLoadError();
        } finally {
          refreshPending = false;
          modulesElement.querySelectorAll(".refresh").forEach((button) => { button.disabled = false; button.setAttribute("aria-busy", "false"); });
        }
      };
      const initializeBridge = async () => {
        const result = await rpcRequest("ui/initialize", { appInfo: { name: "u1-observation", version: "0.4.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" });
        rpcNotify("ui/notifications/initialized", {});
        return result;
      };
      const retryLoad = async () => {
        if (applyGlobals(window.openai)) return;
        if (selectedView) { await refresh(); return; }
        clearTimeout(loadTimer);
        loadTimer = setTimeout(showLoadError, 15000);
        try { bridge = await initializeBridge(); } catch { showLoadError(); }
      };
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (typeof message.id === "number" && pendingRequests.has(message.id)) {
          const pending = pendingRequests.get(message.id); pendingRequests.delete(message.id); clearTimeout(pending.timer);
          message.error ? pending.reject(new Error("Host request failed")) : pending.resolve(message.result); return;
        }
        if (message.method === "ui/notifications/tool-input" && VIEWS.includes(message.params?.arguments?.view) && !selectedView) selectedView = message.params.arguments.view;
        if (message.method === "ui/notifications/tool-result" && !applyResult(message.params) && !observation) showLoadError();
      });
      window.addEventListener("openai:set_globals", (event) => {
        if (!applyGlobals(event.detail?.globals)) applyGlobals(window.openai);
      });
      applyGlobals(window.openai);
      if (!observation) loadTimer = setTimeout(showLoadError, 15000);
      if (window.parent !== window) void initializeBridge().then((result) => { bridge = result; applyGlobals(window.openai); }).catch(showLoadError);
    </script>
  </body>
</html>
