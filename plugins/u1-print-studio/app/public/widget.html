            region.innerHTML = `<div class="neutral-allocation" aria-hidden="true">${'<span></span>'.repeat(rows)}</div>`;
          } else region.style.minHeight = `${height}px`;
        });
        if (retained) modulesElement.append(retained);
        allocationObserver?.disconnect();
        allocationObserver?.observe(modulesElement);
        const titleNode = modulesElement.querySelector('.u1-title');
        if (titleNode) allocationObserver?.observe(titleNode);
        if (retry) modulesElement.querySelector(".refresh")?.addEventListener("click", () => void retryLoad());
        window.openai?.notifyIntrinsicHeight?.();
      };
      const releaseChangedAllocation = () => {
        if (!retainedPresentation?.heights) return;
        const signature = layoutSignature();
        if (Math.abs(signature[0] - retainedPresentation.signature[0]) <= 1 && signature[1] === retainedPresentation.signature[1]) return;
        retainedPresentation.heights = null;
        showPlaceholder(placeholderPhase, placeholderMessage);
      };
      const allocationObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(releaseChangedAllocation) : null;
      allocationObserver?.observe(modulesElement);
      window.addEventListener('resize', releaseChangedAllocation);
      window.addEventListener('pagehide', () => allocationObserver?.disconnect());
      window.addEventListener('pageshow', () => { allocationObserver?.observe(modulesElement); releaseChangedAllocation(); });
      const render = () => { if (!observation?.module) return; disposeMeshRenderer(); retainedPresentation = null; const view = VIEWS.includes(observation.view) ? observation.view : "overview"; modulesElement.innerHTML = renderers[view](observation.module); modulesElement.querySelectorAll(".refresh").forEach((button) => button.addEventListener("click", () => void refresh())); if (view === "bed_mesh") bindMeshControls(); if (view === "heads") bindMaterialCopy(); window.openai?.notifyIntrinsicHeight?.(); };
      const rpcNotify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      const rpcRequest = (method, params) => new Promise((resolve, reject) => {
        const id = ++rpcId;
        const timer = setTimeout(() => { pendingRequests.delete(id); reject(new Error("Host request timed out")); }, 15000);
        pendingRequests.set(id, { resolve, reject, timer });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
      const validObservation = (value) => value && VIEWS.includes(value.view) &&
        value.module?.kind === value.view && typeof value.module.state === "string";
      const failedDomain = (value, depth = 0) => {
        if (!value || typeof value !== 'object' || depth > 3) return false;
        if (['unavailable', 'unsupported'].includes(value.state)) return true;
        if (value.state === 'stale' && ['unauthorized', 'http_error', 'timeout', 'network', 'malformed', 'too_large', 'not_configured', 'unsupported'].includes(value.reason)) return true;
        return [value.materials, value.environment, ...Object.values(value.receipts ?? {}), ...(Array.isArray(value.tiles) ? value.tiles : [])].some(child => child && failedDomain(child, depth + 1));
      };
      const applyResult = (result) => {
        const candidates = [result?.structuredContent, result?.result?.structuredContent, result?.mcp_tool_result?.structuredContent, result?.call_tool_result?.structuredContent, result];
        const candidate = candidates.find(validObservation);
        if (!candidate || (selectedView && candidate.view !== selectedView)) return false;
        selectedView = candidate.view;
        const previous = observation;
        if (failedDomain(candidate.module)) {
          acceptedResult = true;
          // Geometry is not observation acceptance; preserve its numeric shape
          // even when an unknown result or a new epoch invalidates cached data.
          if (previous?.view === candidate.view) retainPresentation();
          const message = candidate.view === "bed_mesh" && candidate.module.reason === "not_reported" ? "Bed mesh not reported" : `${viewTitles[candidate.view]} ${candidate.module.state === "unsupported" ? "endpoint unsupported" : "unavailable"}`;
          if (previous && ["known", "stale"].includes(previous.module.state) && previous.view === candidate.view && Number.isSafeInteger(candidate.connectionEpoch) && candidate.connectionEpoch >= 0 && candidate.connectionEpoch === previous.connectionEpoch) {
            showPlaceholder("unavailable", message);
          } else { observation = null; disposeMeshRenderer(); if (retainedPresentation) retainedPresentation.section = null; showPlaceholder("unavailable", message); }
          clearTimeout(loadTimer);
          return true;
        }
        observation = candidate;
        try { render(); } catch { observation = previous; return false; }
        acceptedResult = true;
        clearTimeout(loadTimer);
        return true;
      };
      const applyGlobals = (globals = {}) => {
        const metadata = globals.toolResponseMetadata;
        const requested = globals.toolInput?.view;
        if (!selectedView && VIEWS.includes(requested)) { selectedView = requested; if (!observation) showPlaceholder(); }
        return [globals.toolOutput, metadata?.mcp_tool_result, metadata?.call_tool_result, metadata].some(applyResult);
      };
      const showLoadError = () => {
        if (observation || acceptedResult) return;
        const canRetry = selectedView && window.parent !== window;
        showPlaceholder("error", `Couldn’t load this view. ${canRetry ? "Try loading the view again." : "Reopen this card from the conversation to try again."}`);
      };
      const refresh = async () => {
        if (!selectedView || refreshPending || window.parent === window) return;
        refreshPending = true;
        if (!observation) { acceptedResult = false; if (placeholderPhase === 'loading') showPlaceholder("loading"); }
        modulesElement.querySelectorAll(".refresh").forEach((button) => { button.disabled = true; button.setAttribute("aria-busy", "true"); });
        try {
          if (!bridge) bridge = await initializeBridge();
          const result = await rpcRequest("tools/call", { name: "refresh_printer_observation", arguments: { view: selectedView } });
          if (!applyResult(result)) throw new Error("Observation unavailable");
        } catch {
          if (observation) showPlaceholder("error", `Could not load ${viewTitles[selectedView]}`);
          else showLoadError();
        } finally {
          refreshPending = false;
          modulesElement.querySelectorAll(".refresh").forEach((button) => { button.disabled = false; button.setAttribute("aria-busy", "false"); });
        }
      };
      const initializeBridge = async () => {
        const result = await rpcRequest("ui/initialize", { appInfo: { name: "u1-observation", version: "0.4.8" }, appCapabilities: {}, protocolVersion: "2026-01-26" });
        rpcNotify("ui/notifications/initialized", {});
        return result;
      };
      const retryLoad = async () => {
        if (selectedView) { await refresh(); return; }
        if (applyGlobals(window.openai)) return;
        clearTimeout(loadTimer);
        loadTimer = setTimeout(showLoadError, 15000);
        try { bridge = await initializeBridge(); } catch { showLoadError(); }
      };
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (typeof message.id === "number" && pendingRequests.has(message.id)) {
          const pending = pendingRequests.get(message.id); pendingRequests.delete(message.id); clearTimeout(pending.timer);
          message.error ? pending.reject(new Error("Host request failed")) : pending.resolve(message.result); return;
        }
        if (message.method === "ui/notifications/tool-input" && VIEWS.includes(message.params?.arguments?.view) && !selectedView) { selectedView = message.params.arguments.view; if (!observation) showPlaceholder(); }
        if (message.method === "ui/notifications/tool-result" && !applyResult(message.params) && !observation) showLoadError();
      });
      window.addEventListener("openai:set_globals", (event) => {
        if (!applyGlobals(event.detail?.globals)) applyGlobals(window.openai);
      });
      showPlaceholder();
      applyGlobals(window.openai);
      if (!acceptedResult) loadTimer = setTimeout(showLoadError, 15000);
      if (window.parent !== window) void initializeBridge().then((result) => { bridge = result; applyGlobals(window.openai); }).catch(showLoadError);
    </script>
  </body>
