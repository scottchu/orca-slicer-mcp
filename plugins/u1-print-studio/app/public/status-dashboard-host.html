<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>U1 · View unavailable</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #fff; color: #202832; }
      header {
        min-height: 44px; padding: 8px 12px; display: flex; align-items: center;
        gap: 10px; border-bottom: 1px solid #eceef0; background: #fff;
      }
      strong { font-size: 13px; letter-spacing: .01em; }
      #bridge-state { color: #707987; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .spacer { flex: 1; }
      button {
        min-height: 30px; padding: 4px 10px; border: 1px solid #eceef0;
        border-radius: 8px; color: inherit; background: #f8f9fa; cursor: pointer;
      }
      header[hidden] { display: none; }
      iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <header hidden>
      <strong id="view-title">View unavailable</strong>
      <span id="bridge-state" role="status" aria-live="polite">starting</span>
      <span class="spacer"></span>
      <button id="reload" type="button">Reload widget</button>
    </header>
    <iframe id="widget" title="View unavailable"></iframe>
    <script>
      "use strict";
      const routes = Object.freeze({
        "/dashboard/overview": ["overview", "Overview"],
        "/dashboard/progress": ["progress", "Print Progress"],
        "/dashboard/thermals": ["thermals", "Thermals"],
        "/dashboard/heads": ["heads", "Heads & Filaments"],
        "/dashboard/jobs": ["jobs", "Current Job"],
        "/dashboard/job_history": ["job_history", "Job History"],
        "/dashboard/queue": ["queue", "Print Queue"],
        "/dashboard/fans": ["fans", "Fans & Air"],
        "/dashboard/bed_mesh": ["bed_mesh", "Bed Mesh"],
      });
      const selected = Object.hasOwn(routes, location.pathname) ? routes[location.pathname] : null;
      const selectedView = selected?.[0];
      const frame = document.querySelector("#widget");
      const widgetSource = selectedView === "fans" ? "/dashboard/fans_widget" : selectedView === "thermals" ? "/dashboard/thermals_widget" : selectedView === "queue" ? "/dashboard/queue_widget" : "/widget?standalone=1";
      const bridgeState = document.querySelector("#bridge-state");
      document.querySelector("#view-title").textContent = selected?.[1] ?? "View unavailable";
      document.title = selected ? `U1 · ${selected[1]}` : "U1 · View unavailable";
      frame.title = selected?.[1] ?? "View unavailable";
      let initialized = false;
      let generation = 0;
      const reply = (id, result, error) => {
        frame.contentWindow?.postMessage({ jsonrpc: "2.0", id, ...(error ? { error } : { result }) }, location.origin);
      };
      const notifyToolResult = (result) => {
        frame.contentWindow?.postMessage({
          jsonrpc: "2.0",
          method: "ui/notifications/tool-result",
          params: result,
        }, location.origin);
      };
      const callTool = async (name, argumentsValue = {}) => {
        if (!selectedView || name !== "refresh_printer_observation" ||
            argumentsValue?.view !== selectedView ||
            Object.keys(argumentsValue).some(key => key !== "view")) {
          throw new Error("unsupported_focused_request");
        }
        bridgeState.textContent = "Reading printer…";
        const response = await fetch("/dashboard/tools/call", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name, arguments: { view: selectedView } }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error ?? `HTTP ${response.status}`);
        bridgeState.textContent = "Observation received";
        return result;
      };

      window.addEventListener("message", async (event) => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.method === "ui/initialize" && typeof message.id === "number") {
          reply(message.id, {
            protocolVersion: "2026-01-26",
            hostInfo: { name: "u1-status-dashboard", version: "1.0.0" },
            hostContext: { displayMode: "inline", safeArea: { insets: { top: 0, right: 0, bottom: 0, left: 0 } } },
          });
          return;
        }

        if (message.method === "ui/notifications/initialized") {
          if (initialized) return;
          initialized = true;
          const current = generation;
          frame.contentWindow?.postMessage({
            jsonrpc: "2.0", method: "ui/notifications/tool-input",
            params: { arguments: { view: selectedView } },
          }, location.origin);
          try {
            const result = await callTool("refresh_printer_observation", { view: selectedView });
            if (current === generation) notifyToolResult(result);
          } catch {
            if (current !== generation) return;
            bridgeState.textContent = "Service unavailable — use Reload widget to retry";
            if (selectedView === "fans") notifyToolResult({ isError: true });
          }
          return;
        }

        if (message.method === "tools/call" && typeof message.id === "number") {
          const current = generation;
          try {
            const result = await callTool(message.params?.name, message.params?.arguments ?? {});
            if (current === generation) reply(message.id, result);
          } catch {
            if (current !== generation) return;
            reply(message.id, null, { code: -32000, message: "tool_failed" });
            bridgeState.textContent = "Refresh failed — use Reload widget to retry";
          }
          return;
        }

        if (message.method === "ui/request-display-mode" && typeof message.id === "number") {
          reply(message.id, { mode: "inline" });
        }
      });

      document.querySelector("#reload").addEventListener("click", () => {
        generation += 1;
        initialized = false;
        bridgeState.textContent = "reloading";
        frame.src = `${widgetSource}${widgetSource.includes("?") ? "&" : "?"}t=${Date.now()}`;
      });
      // Attach the bridge before navigation; the focused view is known before
      // the child requests initialization or any observation is acquired.
      frame.src = widgetSource;
    </script>
  </body>
</html>
