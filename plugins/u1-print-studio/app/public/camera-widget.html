    <script type="module">
      const hosted = window.parent !== window;
      const elements = {
        dashboard: document.querySelector("#dashboard"),
        camera: document.querySelector("#camera"),
        snapshot: document.querySelector("#snapshot"),
        liveStream: document.querySelector("#live-stream"),
        cameraStatus: document.querySelector("#camera-status"),
        cameraDetail: document.querySelector("#camera-detail"),
        cameraDetailLabel: document.querySelector("#camera-detail-label"),
        cameraEmptyMessage: document.querySelector("#camera-empty-message"),
        fullscreen: document.querySelector("#fullscreen"),
        pip: document.querySelector("#picture-in-picture"),
        displayFeedback: document.querySelector("#display-feedback"),
        goLive: document.querySelector("#go-live"),
        closeLive: document.querySelector("#close-live"),
        refreshSnapshot: document.querySelector("#refresh-snapshot"),

      const pendingRequests = new Map();
      let rpcId = 0;
      let cameraRefreshing = false;
      let livePreview = false;
      let relayRendering = false;
      let liveSessionId = null;
      let livePeerConnection = null;

      let snapshotDecodePromise = Promise.resolve(false);
      let feedbackTimer = null;
      let localViewportFullscreen = false;
      let restoredLiveIntentAttempted = false;

      const CAMERA_TOOL_DEADLINE_MS = 10000;
      const CAMERA_DECODE_DEADLINE_MS = 1500;

      const rpcNotify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };
      const rpcRequest = (method, params, timeoutMilliseconds = method === "tools/call" ? 40000 : 15000) => new Promise((resolve, reject) => {
        const id = ++rpcId;
        const timer = setTimeout(() => { pendingRequests.delete(id); reject(new Error("Host request timed out")); }, timeoutMilliseconds);
        pendingRequests.set(id, { resolve, reject, timer });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");

      const callTool = async (name, argumentsValue = {}) => {
        const bridge = await bridgeReady;
        if (!bridge) throw new Error("host bridge unavailable");
        return rpcRequest(
          "tools/call",
          { name, arguments: argumentsValue },
          name === "get_u1_camera_frame" ? CAMERA_TOOL_DEADLINE_MS : 40000

      };

      const persistLiveIntent = (liveRequested) => {
        const setWidgetState = window.openai?.setWidgetState;
        if (typeof setWidgetState !== "function") return;
        const previous = window.openai?.widgetState;
        const state = previous && typeof previous === "object" ? previous : {};
        void Promise.resolve(setWidgetState({ ...state, u1Camera: { liveRequested: Boolean(liveRequested) } })).catch(() => {});

      const setFeedback = (message = "", kind = "info") => {
        clearTimeout(feedbackTimer); feedbackTimer = null;
        elements.displayFeedback.textContent = message;
        elements.displayFeedback.dataset.kind = message ? kind : "";
        const duration = kind === "success" ? 1800 : kind === "info" ? 4000 : 0;
        if (message && duration) feedbackTimer = setTimeout(() => {
          elements.displayFeedback.textContent = "";
          elements.displayFeedback.dataset.kind = "";
          feedbackTimer = null;
        }, duration);
      };

      const setCameraState = (state, loading = false) => {
        const labels = {
          loading: "Camera loading",
          snapshot: "Camera snapshot ready",
          fallback: "Camera snapshot fallback active",
          live: "Live camera active",
          unavailable: "Camera unavailable",
        };
        const label = labels[state] ?? labels.unavailable;
        elements.camera.dataset.cameraStatus = state;
        elements.camera.dataset.cameraLoading = String(Boolean(loading));
        if (elements.cameraStatus.textContent !== label) elements.cameraStatus.textContent = label;
        elements.cameraEmptyMessage.textContent = state === "unavailable"
          ? "Camera unavailable"
          : "Waiting for camera";
        const canGoLive = state === "snapshot" &&
          elements.camera.classList.contains("has-snapshot") && !livePreview;

      const formatCameraTime = (observedAt) => {
        if (typeof observedAt !== "string" || !observedAt) return null;

          ? null

              minute: "2-digit",

      const setCameraMode = (mode) => {

          fallback: `Fallback · ${observedLabel}`,

      const beginSnapshotAcquisition = () => { cancelSnapshotDecode?.(); return ++snapshotGeneration; };

          // the last accepted image. Only the newest acquisition may win.

          let decodeTimer = null;
          let settleDecode;
          snapshotDecodePromise = new Promise(resolve => { settleDecode = resolve; });

            return true;

            snapshotObservedAt = formatCameraTime(frame.observedAt) ? frame.observedAt : null;

              ? relayRendering ? "live" : fallbackDetail ? "fallback" : "loading"
              : "snapshot";

          };

          };

      for (const event of ["enterpictureinpicture", "leavepictureinpicture", "webkitpresentationmodechanged", "webkitbeginfullscreen", "webkitendfullscreen"]) elements.liveStream.addEventListener(event, updateDisplayControls);
      window.addEventListener("openai:set_globals", (event) => applyHostContext(event.detail?.globals));
      window.addEventListener("pagehide", () => {
        livePreview = false;
        stopLiveStream();
      });

      applyHostContext();
      if (!hosted || new URLSearchParams(location.search).has("demo")) {
        setCameraState("unavailable");
        setCameraMode("unavailable");
      } else {
        void bridgeReady.then(async (bridge) => {
          if (!bridge) return;
          const initial = initialToolEnvelope();
          if (initial?.structuredContent?.mediaType !== undefined) {
            if (applyCameraFrame(initial)) await snapshotDecodePromise;
          }
          if (!elements.camera.classList.contains("has-snapshot")) await refreshCameraFrame();
          await restoreLiveIntent();
        });
      }
    </script>
  </body>
</html>
