  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>U1 Printer Camera</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202832; --muted: #707987; --surface: #fff; --line: #eceef1;
        --positive: #23c96a; --negative: #b83232; --brand: #f4b927; --radius: 24px;
        --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: calc(18px + var(--safe-top)) calc(16px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(16px + var(--safe-left)); color: var(--ink); background: #fdfdfd; }
      button { border: 0; color: inherit; font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      button:not(:disabled) { cursor: pointer; }
      button:focus-visible { outline: 3px solid #bf8400; outline-offset: 3px; }
      .dashboard { width: min(100%, 1120px); margin: 0 auto; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 5px 24px rgba(28,30,32,.055); }
      .camera-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; margin-bottom: 18px; }
      .camera-heading { display: flex; align-items: center; gap: 15px; min-width: 0; }
      .camera-heading h1 { margin: 0; font-size: clamp(18px, 2.6vw, 24px); font-weight: 600; letter-spacing: -.02em; }
      .icon-tile { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: #fafbfc; }
      .icon-tile svg { width: 23px; height: 23px; stroke-width: 1.7; }
      .camera-mode { display: inline-flex; max-width: 100%; align-items: center; gap: 9px; margin-left: auto; color: var(--muted); font-size: clamp(12px, 1.8vw, 16px); line-height: 1.65; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .camera-mode-indicator { display: inline-flex; flex: none; width: 8px; height: 8px; }
      .camera-mode-live-dot { display: block; width: 8px; height: 8px; border-radius: 50%; background: #929aa5; }
      .camera-mode[data-mode="live"] .camera-mode-live-dot { background: var(--positive); }
      .camera-mode[data-mode="unavailable"] .camera-mode-live-dot { background: var(--negative); }
      .camera-info { display: flex; flex-direction: column; gap: 8px; }
      .camera-info-message, .display-feedback { margin: 0 0 12px; color: var(--negative); font-size: 12px; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
      .display-feedback:empty, .camera-info-message[hidden] { display: none; }
      .camera { position: relative; aspect-ratio: 16 / 9; overflow: hidden; isolation: isolate; border-radius: 16px; background: #202327; }
      .camera img, .camera video { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; border: 0; object-fit: contain; opacity: 0; }
      .camera.has-snapshot:not(.has-live) img, .camera.has-live video { opacity: 1; }
      .camera-empty { position: absolute; inset: 0; display: grid; place-content: center; color: #b4bbc4; }
      .camera-empty svg { width: 38px; height: 38px; }
      .camera.has-snapshot .camera-empty, .camera.has-live .camera-empty { display: none; }
      .camera-bottom { position: absolute; right: 16px; bottom: 16px; left: 16px; z-index: 4; display: flex; justify-content: flex-end; }
      .camera-controls { display: flex; flex-wrap: wrap; flex: none; max-width: 100%; justify-content: flex-end; align-items: center; gap: 8px; margin-left: auto; }
      .display-button, .camera-button { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; min-width: 44px; min-height: 44px; flex: none; padding: 0; border: 1px solid rgba(255,255,255,.75); border-radius: 50%; color: var(--ink); background: rgba(255,255,255,.93); box-shadow: 0 2px 12px rgba(0,0,0,.08); }
      .display-button svg, .camera-button svg { width: 20px; height: 20px; stroke-width: 1.8; }
      .display-button[hidden] { display: none; }
      .camera-button[hidden] { display: none; }
      .display-button[aria-pressed="true"] { outline: 2px solid var(--brand); }
      .display-button:disabled, .camera-button:disabled { opacity: .55; }
      .camera-button.close { display: none; }
      .camera[data-camera-mode="live"] .camera-button.go-live { display: none; }
      .camera[data-camera-mode="live"] .camera-button.close { display: inline-flex; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      @media (max-width: 540px) {
        body { padding: calc(10px + var(--safe-top)) calc(8px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(8px + var(--safe-left)); }
        .dashboard { padding: 14px; border-radius: 20px; }
        .camera-header { gap: 10px; margin-bottom: 14px; }
        .camera-heading { gap: 12px; }
        .camera-mode { flex-basis: 100%; margin-left: 0; }
        .camera { border-radius: 12px; }
        .camera-bottom { right: 10px; bottom: 10px; left: 10px; }
        .camera-controls { gap: 6px; }
      }
      body[data-display-mode="pip"] { padding: 0; background: #fff; }
      body[data-display-mode="pip"] .dashboard { padding: 10px; }
      body[data-display-mode="fullscreen"] { display: grid; align-content: center; padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); background: #fff; }
      body[data-display-mode="fullscreen"] .dashboard { width: 100%; border: 0; box-shadow: none; }
      .dashboard:fullscreen { display: flex; flex-direction: column; width: 100vw; height: 100vh; border-radius: 0; }
      .dashboard:fullscreen .camera { flex: 1; min-height: 0; aspect-ratio: auto; }
      .dashboard:fullscreen img, .dashboard:fullscreen video { object-fit: contain; }
    </style>
  </head>
  <body data-display-mode="inline">
    <main class="dashboard" id="dashboard">
      <header class="camera-header">
        <div class="camera-heading"><span class="icon-tile" aria-hidden="true"><svg aria-hidden="true" data-icon="feather-camera" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><h1>U1 Camera</h1></div>
        <span class="camera-mode" id="camera-detail" data-mode="loading">
          <span class="camera-mode-indicator" aria-hidden="true"><span class="camera-mode-live-dot"></span></span>
          <span id="camera-detail-label">Connecting</span>
        </span>
      </header>
      <span class="sr-only" id="camera-status" role="status" aria-live="polite">Camera loading</span>
      <div class="camera-info">
        <strong class="camera-info-message" id="camera-empty-message" role="status" aria-live="polite">Waiting for camera</strong>
        <div class="display-feedback" id="display-feedback" role="status" aria-live="polite"></div>
      </div>
      <section class="camera" id="camera" data-camera-mode="loading" data-camera-status="loading" data-camera-loading="true" aria-label="Printer camera">
        <div class="camera-empty" id="camera-empty"><svg aria-hidden="true" data-icon="feather-camera" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <img id="snapshot" alt="Latest Snapmaker U1 camera snapshot" referrerpolicy="no-referrer" />
        <video id="live-stream" aria-label="Live Snapmaker U1 camera" autoplay muted playsinline></video>
        <div class="camera-bottom">
          <div class="camera-controls">
            <button class="display-button" id="picture-in-picture" type="button" aria-label="Picture in picture" title="Picture in picture" aria-pressed="false" hidden><svg aria-hidden="true" data-icon="feather-copy" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
            <button class="display-button" id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen" aria-pressed="false" hidden><svg aria-hidden="true" data-icon="feather-maximize" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
            <button class="display-button" id="refresh-snapshot" type="button" aria-label="Refresh snapshot" title="Refresh snapshot" disabled><svg aria-hidden="true" data-icon="feather-camera" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
            <button class="camera-button go-live" id="go-live" type="button" title="Open live camera" aria-label="Open live camera" disabled hidden><svg aria-hidden="true" data-icon="feather-video" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></button>
            <button class="camera-button close" id="close-live" type="button" title="Close live camera" aria-label="Close live camera"><svg aria-hidden="true" data-icon="feather-x" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      const hosted = window.parent !== window;
      const elements = {
        dashboard: document.querySelector("#dashboard"),
        camera: document.querySelector("#camera"),
        snapshot: document.querySelector("#snapshot"),
        liveStream: document.querySelector("#live-stream"),
        cameraStatus: document.querySelector("#camera-status"),
        cameraDetail: document.querySelector("#camera-detail"),
        cameraDetailLabel: document.querySelector("#camera-detail-label"),
        cameraEmptyMessage: document.querySelector("#camera-empty-message"),
        fullscreen: document.querySelector("#fullscreen"),
        pip: document.querySelector("#picture-in-picture"),
        displayFeedback: document.querySelector("#display-feedback"),
        goLive: document.querySelector("#go-live"),
        closeLive: document.querySelector("#close-live"),
        refreshSnapshot: document.querySelector("#refresh-snapshot"),
      };
      const pendingRequests = new Map();
      let rpcId = 0;
      let cameraRefreshing = false;
      let livePreview = false;
      let relayRendering = false;
      let liveSessionId = null;
      let livePeerConnection = null;
      let snapshotFallbackTimer = null;
      let liveConnectionFallbackTimer = null;
      let firstRenderedFrameTimer = null;
      let liveFrameCallback = null;
      let liveFrameObserverGeneration = 0;
      let liveFrameTimes = [];
      let measuredLiveFps = null;
      let liveFpsExpiryTimer = null;
      let configuredIceMode = "unknown";
      let selectedIcePath = null;
      let fallbackDetail = null;
      let snapshotObservedAt = null;
      let snapshotGeneration = 0;
      let liveObservedAt = null;
      let liveFrameWatchdog = null;
      let decodedFrameTimer = null;
      let hostContext = {};
      let hostBridgeAvailable = false;

      const rpcNotify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };
      const rpcRequest = (method, params) => new Promise((resolve, reject) => {
        const id = ++rpcId;
        const timer = setTimeout(() => { pendingRequests.delete(id); reject(new Error("Host request timed out")); }, method === "tools/call" ? 40000 : 15000);
        pendingRequests.set(id, { resolve, reject, timer });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
      const callTool = async (name, argumentsValue = {}) => {
        const bridge = await bridgeReady;
        if (!bridge) throw new Error("host bridge unavailable");
        return rpcRequest("tools/call", { name, arguments: argumentsValue });
      };

      const setCameraState = (state, loading = false) => {
        const labels = {
          loading: "Camera loading",
          snapshot: "Camera snapshot ready",
          fallback: "Camera snapshot fallback active",
          live: "Live camera active",
          unavailable: "Camera unavailable",
        };
        const label = labels[state] ?? labels.unavailable;
        elements.camera.dataset.cameraStatus = state;
        elements.camera.dataset.cameraLoading = String(Boolean(loading));
        if (elements.cameraStatus.textContent !== label) elements.cameraStatus.textContent = label;
        elements.cameraEmptyMessage.textContent = state === "unavailable"
          ? "Camera unavailable"
          : "Waiting for camera";
        const canGoLive = state === "snapshot" &&
          elements.camera.classList.contains("has-snapshot") && !livePreview;
        elements.goLive.disabled = !canGoLive;
        elements.goLive.hidden = !canGoLive;
        elements.cameraEmptyMessage.hidden = elements.camera.classList.contains("has-snapshot") || relayRendering;
        updateDisplayControls();
        window.openai?.notifyIntrinsicHeight?.();
      };

      const formatCameraTime = (observedAt) => {
        if (typeof observedAt !== "string" || !observedAt) return null;
        const observedDate = new Date(observedAt);
        return Number.isNaN(observedDate.valueOf())
          ? null
          : observedDate.toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });
      };

      const setCameraMode = (mode) => {
        const observedLabel = formatCameraTime(mode === "live" ? liveObservedAt : snapshotObservedAt) ?? "Time unavailable";
        const fps = Number.isFinite(measuredLiveFps) && measuredLiveFps > 0 ? Math.round(measuredLiveFps) : 0;
        const labels = {
          loading: elements.camera.classList.contains("has-snapshot")
            ? `Connecting · ${observedLabel}`
            : "Connecting",
          snapshot: `Snapshot · ${observedLabel}`,
          fallback: `Fallback · ${observedLabel}`,
          live: `Live · ${fps > 0 ? `${fps} FPS · ` : ""}${observedLabel}`,
          unavailable: "Camera unavailable",
        };
        elements.cameraDetail.dataset.mode = mode;
        const label = labels[mode] ?? labels.unavailable;
        if (elements.cameraDetailLabel.textContent !== label) elements.cameraDetailLabel.textContent = label;
        elements.cameraDetail.title = mode === "live"
          ? "Time of the latest video frame displayed on this device"
          : mode === "fallback" ? "Live video unavailable. Showing the last accepted snapshot; time is server image receipt time."
          : "Snapshot time is server image receipt time, not camera capture time";
      };

      const applyCameraFrame = (result, announceRefresh = false) => {
        const frame = result?.structuredContent ?? {};
        const metadata = result?._meta ?? result?.meta ?? {};
        const dataUrl = metadata?.cameraFrame?.dataUrl;
        if (
          frame.available &&
          typeof dataUrl === "string" &&
          dataUrl.startsWith("data:image/jpeg;base64,")
        ) {
          // Decode separately: a failed image must not replace or retimestamp
          // the last accepted image. Only the newest acquisition may win.
          const generation = ++snapshotGeneration;
          const image = new Image();
          image.onload = () => {
            if (generation !== snapshotGeneration) return;
            elements.snapshot.src = dataUrl;
            snapshotObservedAt = formatCameraTime(frame.observedAt) ? frame.observedAt : null;
            elements.camera.classList.add("has-snapshot");
            const mode = livePreview
              ? relayRendering ? "live" : fallbackDetail ? "fallback" : "loading"
              : "snapshot";
            setCameraState(mode, mode === "loading");
            setCameraMode(mode);
            if (announceRefresh) elements.displayFeedback.textContent = relayRendering
              ? "Snapshot refreshed. Live view continues; Close live camera to view the snapshot."
              : "Snapshot refreshed.";
          };
          image.onerror = () => {
            if (generation !== snapshotGeneration) return;
            if (announceRefresh) elements.displayFeedback.textContent = "Snapshot refresh failed. The last accepted camera view is retained.";
            if (relayRendering) return;
            if (elements.camera.classList.contains("has-snapshot")) {
              const mode = livePreview ? (fallbackDetail ? "fallback" : "loading") : "snapshot";
              setCameraState(mode);
              setCameraMode(mode);
            } else { setCameraMode("unavailable"); setCameraState("unavailable"); }
          };
          image.src = dataUrl;
          if (!relayRendering) {
            setCameraState("loading", true);
            setCameraMode(livePreview ? (fallbackDetail ? "fallback" : "loading") : "loading");
          }
          return true;
        }
        if (elements.camera.classList.contains("has-snapshot")) {
          const mode = relayRendering ? "live" : livePreview ? (fallbackDetail ? "fallback" : "loading") : "snapshot";
          setCameraMode(mode);
          setCameraState(mode, mode === "loading");
          return false;
        }
        if (!relayRendering) elements.camera.classList.remove("has-snapshot");
        setCameraMode("unavailable");
        setCameraState("unavailable");
        return false;
      };

      elements.snapshot.addEventListener("error", () => {
        if (livePreview && relayRendering) return;
        elements.camera.classList.remove("has-snapshot");
        setCameraMode("unavailable");
        setCameraState("unavailable");
      });

      const refreshCameraFrame = async (announceRefresh = false) => {
        if (cameraRefreshing || !hosted) return;
        cameraRefreshing = true;
        if (announceRefresh) elements.displayFeedback.textContent = "Refreshing snapshot…";
        elements.refreshSnapshot.setAttribute("aria-busy", "true");
        updateDisplayControls();
        if (!elements.camera.classList.contains("has-snapshot")) {
          setCameraState("loading", true);
          setCameraMode("loading");
        }
        try {
          if (!applyCameraFrame(await callTool("get_u1_camera_frame"), announceRefresh)) elements.displayFeedback.textContent = "Snapshot unavailable. The last accepted camera view is retained when possible.";
        } catch {
          if (announceRefresh) elements.displayFeedback.textContent = "Snapshot refresh failed. The last accepted camera view is retained.";
          if (!elements.camera.classList.contains("has-snapshot")) {
            setCameraMode("unavailable");
            setCameraState("unavailable");
          }
        } finally {
          cameraRefreshing = false;
          elements.refreshSnapshot.setAttribute("aria-busy", "false");
          updateDisplayControls();
          clearTimeout(snapshotFallbackTimer);
          if (livePreview && !relayRendering) {
            snapshotFallbackTimer = setTimeout(refreshCameraFrame, 1500);
          }
        }
      };

      const closeSignalingSession = (sessionId) => {
        if (!sessionId || !hosted) return;
        void callTool("close_u1_camera_stream", { sessionId }).catch(() => {});
      };

      const clearLiveFps = () => {
        clearTimeout(liveFpsExpiryTimer);
        liveFpsExpiryTimer = null;
        liveFrameTimes = [];
        measuredLiveFps = null;
        if (relayRendering) setCameraMode("live");
      };

      const stopLiveStream = () => {
        liveFrameObserverGeneration++;
        clearLiveFps();
        clearTimeout(liveFrameWatchdog);
        liveFrameWatchdog = null;
        clearInterval(decodedFrameTimer);
        decodedFrameTimer = null;
        clearTimeout(liveConnectionFallbackTimer);
        liveConnectionFallbackTimer = null;
        clearTimeout(firstRenderedFrameTimer);
        firstRenderedFrameTimer = null;
        if (liveFrameCallback !== null && elements.liveStream.cancelVideoFrameCallback) {
          elements.liveStream.cancelVideoFrameCallback(liveFrameCallback);
        }
        liveFrameCallback = null;
        const peer = livePeerConnection;
        livePeerConnection = null;
        peer?.close();
        const media = elements.liveStream.srcObject;
        if (media instanceof MediaStream) {
          for (const track of media.getTracks()) track.stop();
        }
        elements.liveStream.srcObject = null;
        elements.camera.classList.remove("has-live");
        relayRendering = false;
        const sessionId = liveSessionId;
        liveSessionId = null;
        closeSignalingSession(sessionId);
        liveFrameTimes = [];
        measuredLiveFps = null;
        liveObservedAt = null;
      };

      const recordLiveFrame = (now = performance.now(), count = null) => {
        liveObservedAt = new Date().toISOString();
        clearTimeout(liveFrameWatchdog);
        liveFrameWatchdog = setTimeout(() => {
          if (livePreview && relayRendering) activateSnapshotFallback("video frames stalled");
        }, 5000);
        const previous = liveFrameTimes.at(-1);
        const canMeasure = Number.isSafeInteger(count) && count >= 0 && Number.isFinite(now) &&
          !elements.liveStream.paused && !["disconnected", "failed", "closed"].includes(livePeerConnection?.connectionState);
        if (!canMeasure || (previous && (count <= previous.count || now <= previous.now))) clearLiveFps();
        if (canMeasure) {
          liveFrameTimes.push({ now, count });
          liveFrameTimes = liveFrameTimes.filter(sample => sample.now >= now - 5000).slice(-600);
          const first = liveFrameTimes[0];
          const elapsed = now - first.now;
          measuredLiveFps = elapsed >= 1000 && count > first.count ? (count - first.count) * 1000 / elapsed : null;
          clearTimeout(liveFpsExpiryTimer);
          const peer = livePeerConnection;
          liveFpsExpiryTimer = setTimeout(() => { if (livePeerConnection === peer) clearLiveFps(); }, 1500);
        }
        setCameraMode("live");
      };

      const markFirstRenderedFrame = (now = performance.now(), count = null) => {
        if (!livePreview || !livePeerConnection || relayRendering) return false;
        relayRendering = true;
        clearTimeout(firstRenderedFrameTimer);
        firstRenderedFrameTimer = null;
        clearTimeout(snapshotFallbackTimer);
        elements.camera.classList.add("has-live");
        setCameraState("live");
        recordLiveFrame(now, count);
        return true;
      };

      const observeRenderedFrames = () => {
        const peer = livePeerConnection;
        const generation = ++liveFrameObserverGeneration;
        // A peer can emit more than one track event. Keep exactly one observer,
        // including callbacks already queued when cancellation takes effect.
        if (liveFrameCallback !== null && elements.liveStream.cancelVideoFrameCallback) {
          elements.liveStream.cancelVideoFrameCallback(liveFrameCallback);
        }
        liveFrameCallback = null;
        clearInterval(decodedFrameTimer);
        decodedFrameTimer = null;
        clearLiveFps();
        const decodedCounter = typeof elements.liveStream.getVideoPlaybackQuality === "function"
          ? () => elements.liveStream.getVideoPlaybackQuality()?.totalVideoFrames
          : () => elements.liveStream.webkitDecodedFrameCount;
        const frameCount = () => {
          try { return decodedCounter(); }
          catch { return undefined; }
        };
        if (typeof elements.liveStream.requestVideoFrameCallback === "function") {
          const observeFrame = (now, metadata) => {
            if (!livePreview || livePeerConnection !== peer || generation !== liveFrameObserverGeneration) return;
            // Do not mix presented and decoded counter families within a window.
            const count = metadata?.presentedFrames;
            if (!markFirstRenderedFrame(now, count)) recordLiveFrame(now, count);
            liveFrameCallback = elements.liveStream.requestVideoFrameCallback(observeFrame);
          };
          liveFrameCallback = elements.liveStream.requestVideoFrameCallback(observeFrame);
          return;
        }
        // Older hosts: only an advancing decoded-frame count is evidence.
        // `playing` or a wall-clock tick alone must never label black video live.
        let previous = frameCount();
        decodedFrameTimer = setInterval(() => {
          if (!livePreview || livePeerConnection !== peer || generation !== liveFrameObserverGeneration) return;
          if (elements.liveStream.paused) { clearLiveFps(); return; }
          const count = frameCount();
          if (Number.isSafeInteger(count) && count >= 0 && Number.isSafeInteger(previous) && previous >= 0 && count > previous) {
            const now = performance.now();
            if (!markFirstRenderedFrame(now, count)) recordLiveFrame(now, count);
          } else if (!Number.isSafeInteger(count) || count < 0 || !Number.isSafeInteger(previous) || count < previous) {
            clearLiveFps();
          }
          previous = count;
        }, 250);
      };

      const fallbackMessage = (reason) => {
        const normalized = String(reason || "relay unavailable").toLowerCase();
        if (normalized.includes("busy") || normalized.includes("active")) {
          return "camera session busy";
        }
        if (normalized.includes("activation")) return "activation expired";
        if (
          normalized.includes("ice") ||
          normalized.includes("connection") ||
          normalized.includes("rendered video")
        ) {
          return configuredIceMode === "turn"
            ? "ICE path failed (TURN configured)"
            : configuredIceMode === "stun"
              ? "ICE path failed (STUN-only)"
              : "ICE path failed (direct-only)";
        }
        if (normalized.includes("playback")) return "video playback blocked";
        if (normalized.includes("track ended")) return "video track ended";
        return "stream unavailable";
      };

      const readSelectedIcePath = async (peer) => {
        try {
          const stats = await peer.getStats();
          let pair = null;
          for (const report of stats.values()) {
            if (report.type === "transport" && report.selectedCandidatePairId) {
              pair = stats.get(report.selectedCandidatePairId);
              break;
            }
            if (report.type === "candidate-pair" && report.nominated && report.state === "succeeded") {
              pair = report;
            }
          }
          const local = pair?.localCandidateId ? stats.get(pair.localCandidateId) : null;
          const remote = pair?.remoteCandidateId ? stats.get(pair.remoteCandidateId) : null;
          const localType = local?.candidateType;
          const remoteType = remote?.candidateType;
          const protocol = local?.protocol;
          if (localType || remoteType) {
            selectedIcePath = [localType, remoteType].filter(Boolean).join("→");
            if (protocol) selectedIcePath += `/${protocol}`;
            // Retain diagnostics internally; connection selection is not
            // evidence that a video frame has rendered.
          }
        } catch {
          // Connection remains usable when the host withholds WebRTC stats.
        }
      };

      const activateSnapshotFallback = (reason = "relay unavailable") => {
        if (!livePreview) return;
        fallbackDetail = fallbackMessage(reason);
        stopLiveStream();
        elements.camera.dataset.cameraMode = "live";
        setCameraState("loading", true);
        setCameraMode("fallback");
        elements.cameraStatus.textContent = "Live video unavailable. Showing snapshot fallback.";
        void refreshCameraFrame();
      };

      const connectStreamResult = async (response) => {
        const stream = response?._meta?.cameraStream ?? response?.meta?.cameraStream;
        const sessionId = stream?.sessionId;
        const offer = stream?.offer;
        if (typeof sessionId === "string") liveSessionId = sessionId;
        if (!livePreview) {
          closeSignalingSession(sessionId);
          return;
        }
        if (
          response?.structuredContent?.available !== true ||
          stream?.transport !== "mcp-apps-tools" ||
          typeof sessionId !== "string" ||
          offer?.type !== "offer" ||
          typeof offer?.sdp !== "string"
        ) {
          throw new Error(response?.structuredContent?.reason ?? "relay unavailable");
        }
        configuredIceMode = response?.structuredContent?.iceMode ?? "unknown";

        const peer = new RTCPeerConnection({
          sdpSemantics: "unified-plan",
          iceServers: Array.isArray(stream.iceServers) ? stream.iceServers : [],
        });
        livePeerConnection = peer;
        peer.addTransceiver("video", { direction: "recvonly" });
        peer.ondatachannel = (event) => {
          if (event.channel.label === "keepalive") {
            event.channel.onmessage = () => event.channel.send("pong");
          }
        };
        peer.onicecandidate = (event) => {
          if (!event.candidate || livePeerConnection !== peer || !liveSessionId) return;
          void callTool("add_u1_camera_ice_candidates", {
            sessionId: liveSessionId,
            candidates: [event.candidate.toJSON()],
          }).catch(() => activateSnapshotFallback("ICE candidate relay failed"));
        };
        peer.ontrack = (event) => {
          if (livePeerConnection !== peer || !livePreview) return;
          const media = event.streams[0] ?? new MediaStream([event.track]);
          elements.liveStream.srcObject = media;
          event.track.addEventListener(
            "ended",
            () => activateSnapshotFallback("video track ended"),
            { once: true }
          );
          observeRenderedFrames();
          void elements.liveStream.play().catch(() => {
            activateSnapshotFallback("video playback rejected");
          });
        };
        peer.onconnectionstatechange = () => {
          if (livePeerConnection !== peer || !livePreview) return;
          if (peer.connectionState === "connected") {
            clearTimeout(liveConnectionFallbackTimer);
            liveConnectionFallbackTimer = null;
            void readSelectedIcePath(peer);
          } else if (peer.connectionState === "failed") {
            activateSnapshotFallback("connection failed");
          } else if (peer.connectionState === "disconnected") {
            clearLiveFps();
            clearTimeout(liveConnectionFallbackTimer);
            liveConnectionFallbackTimer = setTimeout(() => {
              if (peer.connectionState !== "connected") {
                activateSnapshotFallback("connection disconnected");
              }
            }, 3000);
          }
        };

        await peer.setRemoteDescription({ type: "offer", sdp: offer.sdp });
        const answer = await peer.createAnswer();
        await peer.setLocalDescription(answer);
        await callTool("answer_u1_camera_stream", {
          sessionId,
          sdp: peer.localDescription?.sdp,
        });
        if (!relayRendering) {
          firstRenderedFrameTimer = setTimeout(() => {
            if (!relayRendering) activateSnapshotFallback("no rendered video frames");
          }, 8000);
        }
      };

      const openCameraStream = async () => {
        if (!hosted || livePreview) return;
        livePreview = true;
        relayRendering = false;
        configuredIceMode = "unknown";
        selectedIcePath = null;
        fallbackDetail = null;
        elements.camera.dataset.cameraMode = "live";
        clearTimeout(snapshotFallbackTimer);
        setCameraState("loading", true);
        setCameraMode("loading");
        try {
          const activationResult = await callTool("get_u1_camera_frame", {
            authorizeLive: true,
          });
          applyCameraFrame(activationResult);
          const activation = activationResult?._meta?.cameraActivation ??
            activationResult?.meta?.cameraActivation;
          if (typeof activation?.token !== "string") {
            throw new Error("camera activation unavailable");
          }
          await connectStreamResult(await callTool("open_u1_camera_stream", {
            activationToken: activation.token,
          }));
        } catch (error) {
          activateSnapshotFallback(error?.message ?? "relay unavailable");
        }
      };

      const closeLive = () => {
        livePreview = false;
        stopLiveStream();
        clearTimeout(snapshotFallbackTimer);
        elements.camera.dataset.cameraMode = "snapshot";
        if (elements.camera.classList.contains("has-snapshot")) {
          setCameraState("snapshot");
          setCameraMode("snapshot");
        } else {
          setCameraState("loading", true);
          setCameraMode("loading");
          void refreshCameraFrame();
        }
      };

      elements.liveStream.addEventListener("stalled", () => {
        if (livePreview) activateSnapshotFallback("video playback stalled");
      });
      elements.liveStream.addEventListener("pause", () => {
        if (livePreview && relayRendering) activateSnapshotFallback("video playback paused");
      });
      elements.liveStream.addEventListener("error", () => {
        if (livePreview) activateSnapshotFallback("video playback failed");
      });

      const applyHostContext = (context = {}) => {
        hostContext = { ...hostContext, ...context };
        const mode = context.displayMode ?? window.openai?.displayMode;
        if (["inline", "fullscreen", "pip"].includes(mode)) document.body.dataset.displayMode = mode;
        const safeArea = context.safeArea ?? window.openai?.safeArea;
        const insets = safeArea?.insets ?? safeArea ?? {};
        for (const side of ["top", "right", "bottom", "left"]) {
          const value = Number(insets[side]);
          if (Number.isFinite(value) && value >= 0) {
            document.documentElement.style.setProperty(`--safe-${side}`, `${value}px`);
          }
        }
        updateDisplayControls();
      };

      const hostSupports = (mode) => Array.isArray(hostContext.availableDisplayModes)
        ? hostContext.availableDisplayModes.includes(mode)
        : typeof window.openai?.requestDisplayMode === "function";
      const canNativePip = () => relayRendering && (
        (document.pictureInPictureEnabled && typeof elements.liveStream.requestPictureInPicture === "function") ||
        elements.liveStream.webkitSupportsPresentationMode?.("picture-in-picture") === true
      );
      const updateDisplayControls = () => {
        elements.refreshSnapshot.disabled = cameraRefreshing || !hostBridgeAvailable;
        const mode = document.body.dataset.displayMode;
        const fullscreenActive = mode === "fullscreen" || Boolean(document.fullscreenElement) || elements.liveStream.webkitDisplayingFullscreen === true;
        const pipActive = mode === "pip" || document.pictureInPictureElement === elements.liveStream || elements.liveStream.webkitPresentationMode === "picture-in-picture";
        elements.fullscreen.hidden = !fullscreenActive && !hostSupports("fullscreen") && !(document.fullscreenEnabled && typeof elements.dashboard.requestFullscreen === "function") && !(relayRendering && typeof elements.liveStream.webkitEnterFullscreen === "function");
        elements.pip.hidden = !pipActive && !hostSupports("pip") && !canNativePip();
        elements.fullscreen.setAttribute("aria-pressed", String(fullscreenActive));
        elements.pip.setAttribute("aria-pressed", String(pipActive));
        elements.fullscreen.setAttribute("aria-label", fullscreenActive ? "Exit fullscreen" : "Fullscreen");
        elements.pip.setAttribute("aria-label", pipActive ? "Exit picture in picture" : "Picture in picture");
      };
      const requestCameraDisplay = async (requestedMode) => {
        elements.displayFeedback.textContent = "";
        const button = requestedMode === "pip" ? elements.pip : elements.fullscreen;
        const exiting = button.getAttribute("aria-pressed") === "true";
        button.disabled = true;
        try {
          const hostModeActive = document.body.dataset.displayMode === requestedMode;
          if ((hostSupports(requestedMode) && !exiting) || hostModeActive) {
            const mode = exiting ? "inline" : requestedMode;
            const result = hostBridgeAvailable && Array.isArray(hostContext.availableDisplayModes)
              ? await rpcRequest("ui/request-display-mode", { mode })
              : await window.openai.requestDisplayMode({ mode });
            const granted = result?.mode;
            if (!["inline", "fullscreen", "pip"].includes(granted)) throw new Error("No granted mode");
            applyHostContext({ displayMode: granted });
            if (granted !== mode) elements.displayFeedback.textContent = granted === "fullscreen" && mode === "pip"
              ? "This app opened fullscreen instead of picture in picture."
              : "This display mode is not available in this app.";
          } else if (requestedMode === "fullscreen") {
            if (document.fullscreenElement) await document.exitFullscreen();
            else if (elements.liveStream.webkitDisplayingFullscreen) elements.liveStream.webkitExitFullscreen();
            else if (document.fullscreenEnabled && elements.dashboard.requestFullscreen) await elements.dashboard.requestFullscreen();
            else if (relayRendering && elements.liveStream.webkitEnterFullscreen) elements.liveStream.webkitEnterFullscreen();
            else throw new Error("Unsupported fullscreen");
          } else {
            if (document.pictureInPictureElement === elements.liveStream) await document.exitPictureInPicture();
            else if (elements.liveStream.webkitPresentationMode === "picture-in-picture") elements.liveStream.webkitSetPresentationMode("inline");
            else if (canNativePip() && document.pictureInPictureEnabled) await elements.liveStream.requestPictureInPicture();
            else if (canNativePip()) elements.liveStream.webkitSetPresentationMode("picture-in-picture");
            else throw new Error("Unsupported picture in picture");
          }
        } catch {
          elements.displayFeedback.textContent = "This display mode is unavailable here. The camera remains open.";
        } finally { button.disabled = false; updateDisplayControls(); }
      };

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (typeof message.id === "number") {
          const pending = pendingRequests.get(message.id);
          if (!pending) return;
          pendingRequests.delete(message.id);
          clearTimeout(pending.timer);
          message.error ? pending.reject(message.error) : pending.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          const payload = message.params?.structuredContent ?? {};
          if (payload?.mediaType !== undefined) applyCameraFrame(message.params);
        }
        if (message.method === "ui/notifications/host-context-changed") {
          applyHostContext(message.params);
        }
      }, { passive: true });

      const initializeBridge = async () => {
        if (!hosted) return null;
        const result = await rpcRequest("ui/initialize", {
          appInfo: { name: "u1-camera-widget", version: "0.4.0-camera-v8" },
          appCapabilities: {},
          protocolVersion: "2026-01-26",
        });
        rpcNotify("ui/notifications/initialized", {});
        hostBridgeAvailable = true;
        applyHostContext(result?.hostContext);
        return result;
      };
      const bridgeReady = initializeBridge().catch(() => {
        setCameraState("unavailable");
        setCameraMode("unavailable");
        return null;
      });

      const initialToolEnvelope = () => {
        const metadata = window.openai?.toolResponseMetadata;
        const nested = metadata?.mcp_tool_result ?? metadata?.call_tool_result;
        const envelope = nested && typeof nested === "object" ? nested : null;
        return {
          structuredContent: envelope?.structuredContent ?? window.openai?.toolOutput,
          _meta: envelope?._meta ?? metadata,
        };
      };

      elements.refreshSnapshot.addEventListener("click", () => void refreshCameraFrame(true));
      elements.goLive.addEventListener("click", openCameraStream);
      elements.closeLive.addEventListener("click", closeLive);
      elements.liveStream.addEventListener("pause", clearLiveFps);
      elements.liveStream.addEventListener("ended", clearLiveFps);
      elements.fullscreen.addEventListener("click", () => void requestCameraDisplay("fullscreen"));
      elements.pip.addEventListener("click", () => void requestCameraDisplay("pip"));
      document.addEventListener("fullscreenchange", updateDisplayControls);
      for (const event of ["enterpictureinpicture", "leavepictureinpicture", "webkitpresentationmodechanged", "webkitbeginfullscreen", "webkitendfullscreen"]) elements.liveStream.addEventListener(event, updateDisplayControls);
      window.addEventListener("openai:set_globals", (event) => applyHostContext(event.detail?.globals));
      window.addEventListener("pagehide", () => {
        livePreview = false;
        stopLiveStream();
      });

      applyHostContext();
      if (!hosted || new URLSearchParams(location.search).has("demo")) {
        setCameraState("unavailable");
        setCameraMode("unavailable");
      } else {
        void bridgeReady.then((bridge) => {
          if (!bridge) return;
          const initial = initialToolEnvelope();
          if (initial?.structuredContent?.mediaType !== undefined) {
            applyCameraFrame(initial);
          } else {
            void refreshCameraFrame();
          }
        });
      }
    </script>
  </body>
</html>
