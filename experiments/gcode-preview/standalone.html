<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planned toolpath preview</title>
<style>
:root { color-scheme:light dark; --foreground:light-dark(#222,#ededed); --background:light-dark(#fff,#191919); --muted-foreground:light-dark(#606060,#b8b8b8); --viz-series-1:light-dark(#007e9a,#5acfe1); font:16px system-ui,sans-serif; }
body { margin:0; background:var(--background); color:var(--foreground); }
main { max-width:736px; margin:auto; padding:16px; }
h3 { font-size:1.2rem; font-weight:500; margin:0 0 12px; }
.text-small { font-size:.875rem; }
.text-muted { color:var(--muted-foreground); }
.tabular-nums { font-variant-numeric:tabular-nums; }
.viz-row,.viz-controls { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
.viz-controls { margin-top:12px; }
.form-label { display:block; }
.form-range { display:block; width:100%; margin:12px 0; }
.form-select { font:inherit; margin-left:8px; padding:6px; }
.form-check { display:flex; align-items:center; gap:8px; }
.form-check-input { width:18px; height:18px; }
summary { cursor:pointer; }
@media (pointer:coarse) { .form-check,.form-label,.form-range,summary { min-height:44px; } }
</style></head><body><main>__FRAGMENT__</main></body></html>
